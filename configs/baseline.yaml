project:
  name: neuromap-ai
  task: binary_whole_tumor_segmentation
  seed: 42

data:
  modalities:
    - t1
    - t1ce
    - t2
    - flair
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
  image_size:
    - 256
    - 256

model:
  architecture: 2d_unet
  in_channels: 4
  out_channels: 1

training:
  batch_size: 4
  epochs: 50
  learning_rate: 0.0001
  num_workers: 2

evaluation:
  threshold: 0.5
  metrics:
    - dice
    - iou
    - sensitivity
    - volumetric_error
